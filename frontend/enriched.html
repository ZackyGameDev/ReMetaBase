<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReMetaBase · Enriched Catalog</title>
<style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#e7eaf2;background:#0b1020}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:24px 18px}header,.bar,.head{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0}h3{font-size:16px;margin:20px 0 8px}p{margin:5px 0;color:#aab3c5}.panel,.card{background:#121a2e;border:1px solid #26324b;border-radius:12px;padding:18px;margin:14px 0}.card{padding:14px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}input,select,textarea{background:#0b1222;border:1px solid #33415e;border-radius:7px;color:#e7eaf2;padding:10px}input[type=search]{flex:1;min-width:230px}button,.link{background:#1d2b49;color:#e7eaf2;border:1px solid #364868;border-radius:7px;padding:9px 12px;cursor:pointer;text-decoration:none}.active{background:#174ea6}.badge{display:inline-block;background:#263652;border-radius:20px;padding:4px 8px;font-size:12px;margin:3px}.green{color:#55d6a2}.yellow{color:#f5c451}.red{color:#ff7777}.health{height:7px;background:#25314b;border-radius:10px;overflow:hidden;margin-top:8px}.health i{display:block;height:100%;background:#34d399}.columns{display:grid;gap:8px}.column{border:1px solid #26324b;border-radius:9px;padding:12px}.type{font-weight:700;color:#9db8ff}.muted{color:#8995aa;font-size:13px}.annotation{background:#0d1527;padding:11px;border-radius:8px;margin-top:8px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px}.dialog{max-width:540px;width:100%;background:#121a2e;border:1px solid #33415e;border-radius:12px;padding:20px}.dialog label{display:grid;gap:6px;margin:10px 0}.dialog textarea{min-height:80px}.dialog .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.empty{padding:30px;text-align:center;color:#8995aa}a{color:#9db8ff}@media(max-width:650px){.wrap{padding:16px 10px}}
</style></head><body><main class="wrap">
<header><div><h1>ReMetaBase · Enriched Catalog</h1><p>Business definitions, ownership, and data health</p></div><nav><a class="link" href="/index.html">Technical &amp; Sync</a> <a class="link" href="/lineage.html">Lineage &amp; Fragments</a></nav></header>
<section class="panel"><div class="controls"><input id="search" type="search" placeholder="Search tables, columns, definitions, owners, or tags…" oninput="render()"><button id="all" class="active" onclick="setFilter('all')">All</button><button id="annotated" onclick="setFilter('annotated')">Annotated</button><button id="needs" onclick="setFilter('needs')">Needs docs</button><select id="source" onchange="render()"><option value="">All sources</option></select></div><div id="catalog"><div class="empty">Loading catalog…</div></div></section>
</main>
<div id="modal" class="modal"><div class="dialog"><div class="head"><h2 id="modal-title">Edit documentation</h2><button type="button" id="ai-suggest-btn" onclick="generateAnnotationWithAI()">✨ Auto-fill with AI</button></div><p id="ai-suggest-status" class="muted" aria-live="polite"></p><form id="form"><label>Data owner<input id="owner"></label><label>Definition<textarea id="definition"></textarea></label><label>Purpose<textarea id="purpose"></textarea></label><label>Tags (comma separated)<input id="tags"></label><label>Updated by<select id="user" required></select></label><div class="buttons"><button type="button" id="delete-annotation" onclick="deleteAnnotation()" style="margin-right:auto;display:none">Clear docs</button><button type="button" onclick="closeModal()">Cancel</button><button type="submit" class="active">Save</button></div></form></div></div>
<script>
let sources=[],users=[],filter='all',editing=null,annotationCache={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(url,payload){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json().catch(()=>({detail:response.statusText}));if(!response.ok)throw new Error(body.detail||`HTTP ${response.status}`);return body}
async function load(){try{[sources,users]=await Promise.all([fetch('/api/catalog').then(r=>r.json()),fetch('/api/annotations/users').then(r=>r.json()).then(x=>x.users)]);document.querySelector('#source').innerHTML='<option value="">All sources</option>'+sources.map(s=>`<option value="${s.source_id}">${esc(s.name)}</option>`).join('');render()}catch(e){document.querySelector('#catalog').innerHTML=`<div class="empty">Could not load catalog: ${esc(e.message)}</div>`}}
function setFilter(value){filter=value;['all','annotated','needs'].forEach(k=>document.querySelector('#'+k).classList.toggle('active',k===value));render()}
function searchable(src,t,c){return [src.name,t.table_name,t.annotation?.definition,t.annotation?.purpose,t.annotation?.data_owner,...(t.annotation?.tags||[]),c?.column_name,c?.annotation?.definition,c?.annotation?.purpose,c?.annotation?.data_owner,...(c?.annotation?.tags||[])].join(' ').toLowerCase()}
function render(){annotationCache={};const q=document.querySelector('#search').value.toLowerCase(),sid=document.querySelector('#source').value;const html=[];for(const src of sources){if(sid&&String(src.source_id)!==sid)continue;for(const t of src.tables){const tableAnn=t.annotation,annotated=!!(tableAnn||t.columns.some(c=>c.annotation));if(filter==='annotated'&&!annotated||filter==='needs'&&annotated)continue;const cols=t.columns.filter(c=>{const hit=!q||searchable(src,t,c).includes(q);return hit});if(q&&!searchable(src,t,null).includes(q)&&!cols.length)continue;const nullRate=Number(t.null_fraction)||0,health=nullRate===0?'Clean':nullRate<.2?'Partial':'Sparse',healthClass=nullRate===0?'green':nullRate<.2?'yellow':'red';annotationCache[`TABLE:${t.table_id}`]=tableAnn;html.push(`<article class="card"><div class="head"><div><h2>${esc(t.table_name)}</h2><p>${esc(src.name)} · ${esc(src.db_type)} <span class="badge">${t.row_count} rows</span></p></div><div class="${healthClass}">${health} · ${(nullRate*100).toFixed(1)}% avg nulls</div></div><div class="health"><i style="width:${Math.max(0,Math.min(100,(1-nullRate)*100))}%"></i></div>${annotationBox(tableAnn)}<button onclick="openModal('TABLE',${t.table_id})">${tableAnn?'Edit':'Add'} table docs</button><h3>Columns</h3><div class="columns">${cols.map(c=>columnHtml(c)).join('')||'<p>No matching columns.</p>'}</div></article>`)}}document.querySelector('#catalog').innerHTML=html.join('')||'<div class="empty">No matching catalog entries.</div>'}
function annotationBox(a){return a?`<div class="annotation"><p><b>Definition:</b> ${esc(a.definition||'—')}</p><p><b>Purpose:</b> ${esc(a.purpose||'—')}</p><p><b>Owner:</b> ${esc(a.data_owner||'—')}</p><p>${(a.tags||[]).map(x=>`<span class="badge">#${esc(x)}</span>`).join('')} <span class="muted">Updated by ${esc(a.author||'—')}</span></p></div>`:'<p class="muted">No business documentation yet.</p>'}
function columnHtml(c){const a=c.annotation;annotationCache[`COLUMN:${c.column_id}`]=a;const badges=[c.is_primary_key?'Primary key':'',!c.is_nullable?'Required':'Optional',c.dialect_props?.unique?'Unique':'',c.foreign_key?`Links to ${c.foreign_key}`:'',...(c.dialect_props?.check_constraints||[]).map(x=>`Rule: ${x}`)].filter(Boolean);return `<div class="column"><div class="head"><div><span class="type">${esc(c.unified_type||'UNKNOWN')}</span> <span class="muted">${esc(c.raw_type)}</span><div><b>${esc(c.column_name)}</b></div></div><button onclick="openModal('COLUMN',${c.column_id})">Edit</button></div><div>${badges.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>${annotationBox(a)}</div>`}
function openModal(type,id){const ann=annotationCache[`${type}:${id}`];editing={type,id,ann};document.querySelector('#modal-title').textContent=`${ann?'Edit':'Add'} ${type.toLowerCase()} documentation`;document.querySelector('#owner').value=ann?.data_owner||'';document.querySelector('#definition').value=ann?.definition||'';document.querySelector('#purpose').value=ann?.purpose||'';document.querySelector('#tags').value=(ann?.tags||[]).join(', ');document.querySelector('#delete-annotation').style.display=ann?'inline-block':'none';document.querySelector('#user').innerHTML=users.map(u=>`<option value="${u.user_id}" ${u.user_id===ann?.user_id?'selected':''}>${esc(u.name)} (${esc(u.role)})</option>`).join('');document.querySelector('#modal').style.display='grid'}
async function generateAnnotationWithAI(){const button=document.querySelector('#ai-suggest-btn'),status=document.querySelector('#ai-suggest-status');button.disabled=true;status.textContent='Thinking with Qwen2.5 (first run may take a moment to load the model)…';try{if(!editing||!Number.isInteger(Number(editing.id))||!['TABLE','COLUMN'].includes(editing.type))throw new Error('Invalid annotation target');const payload={target_type:editing.type,target_id:Number(editing.id)};console.info('AI suggest request:',payload);const suggestion=await post('/api/annotations/ai-suggest',payload);console.info('AI suggest succeeded:',suggestion.model);document.querySelector('#owner').value=suggestion.data_owner||'';document.querySelector('#definition').value=suggestion.definition||'';document.querySelector('#purpose').value=suggestion.purpose||'';document.querySelector('#tags').value=(suggestion.tags||[]).join(', ');status.textContent=`Drafted by ${suggestion.model} — review and save.`}catch(err){console.error('AI suggest failed:',err);status.textContent=`AI suggestion failed: ${err.message||String(err)}. Check the server terminal for details.`}finally{button.disabled=false}}
function closeModal(){document.querySelector('#modal').style.display='none'}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();try{await fetch('/api/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_type:editing.type,target_id:editing.id,user_id:Number(document.querySelector('#user').value),data_owner:document.querySelector('#owner').value,definition:document.querySelector('#definition').value,purpose:document.querySelector('#purpose').value,tags:document.querySelector('#tags').value.split(',').map(x=>x.trim()).filter(Boolean)})}).then(async r=>{if(!r.ok)throw Error(await r.text())});closeModal();await load()}catch(err){alert(`Could not save annotation: ${err.message}`)}});
async function deleteAnnotation(){if(!editing?.ann?.annotation_id)return;try{const response=await fetch(`/api/annotations/${editing.ann.annotation_id}`,{method:'DELETE'});if(!response.ok)throw Error(await response.text());closeModal();await load()}catch(err){alert(`Could not clear annotation: ${err.message}`)}}
load();setInterval(load,10000);
</script></body></html>
