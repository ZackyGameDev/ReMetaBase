<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReMetaBase · Ask Catalog</title><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#e7eaf2;background:#0b1020}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 18px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:20px;margin:0}p{color:#aab3c5;line-height:1.5}.panel,.card{background:#121a2e;border:1px solid #26324b;border-radius:12px;padding:18px;margin:16px 0}.card{padding:14px}.muted{color:#8995aa;font-size:13px}a,button{color:#dce5ff;background:#1d2b49;border:1px solid #364868;border-radius:7px;padding:9px 12px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#263958}.primary{background:#174ea6}textarea{display:block;width:100%;min-height:100px;background:#0b1222;border:1px solid #33415e;border-radius:8px;color:#e7eaf2;padding:12px;font:inherit;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{font-size:13px}.answer{font-size:16px;line-height:1.6}.badge{display:inline-block;background:#263652;border-radius:20px;padding:4px 8px;font-size:12px}.asset{border-top:1px solid #26324b;padding:14px 0}.error{color:#ff9999}.loading{color:#aab3c5}.loading:after{content:' ';display:inline-block;width:7px;height:7px;border-radius:50%;background:#9db8ff;margin-left:6px;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.2}}.empty{padding:18px;color:#8995aa}
</style></head><body><main class="wrap"><header><div><h1>ReMetaBase · Ask Catalog</h1><p>Ask questions about the databases and metadata in your catalog.</p></div><nav><a href="/index.html">Technical &amp; Sync</a> <a href="/enriched.html">Enriched Catalog</a> <a href="/lineage.html">Lineage &amp; Fragments</a></nav></header>
<section class="panel"><h2>What would you like to find?</h2><p class="muted">Answers are grounded in catalog metadata. Ollama is optional; keyword search works when it is offline.</p><textarea id="question" maxlength="500" placeholder="Ask about tables, columns, ownership, fragments, or relationships…"></textarea><div class="chips"><button class="chip" data-q="Which tables across all databases track employee IDs?">Tables tracking employee IDs</button><button class="chip" data-q="Which tables are horizontally fragmented?">Horizontal fragments</button><button class="chip" data-q="Show tables with customer PII or email addresses">Customer PII and email</button><button class="chip" data-q="Which tables have the highest null rate or no business owner?">Null rates or missing owners</button></div><div class="row"><span id="status" class="muted"></span><button id="ask" class="primary" onclick="askCatalog()">Ask Catalog</button></div></section><section id="results"></section></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('[data-q]').forEach(button=>button.onclick=()=>{document.querySelector('#question').value=button.dataset.q;askCatalog()});
async function askCatalog(){const input=document.querySelector('#question'),status=document.querySelector('#status'),button=document.querySelector('#ask'),results=document.querySelector('#results'),query=input.value.trim();if(query.length<2){status.textContent='Enter at least two characters.';return}button.disabled=true;status.className='muted loading';status.textContent='Searching catalog with Qwen2.5 (first query may take a few seconds to load the model)…';results.innerHTML='';try{const response=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});const data=await response.json();if(!response.ok)throw Error(data.detail||`Request failed (${response.status})`);status.className='muted';status.textContent='';const label=data.mode==='ai'?`Answered by ${data.model||'Ollama'}`:'Keyword fallback';results.innerHTML=`<article class="panel"><div class="row"><h2>Answer</h2><span class="badge">${esc(label)}</span></div><p class="answer">${esc(data.answer)}</p></article><section class="panel"><h2>Catalog matches (${data.matches.length})</h2>${data.matches.length?data.matches.map(m=>{const href=m.asset_type==='COLUMN'?`/enriched.html#column-${m.column_id}`:'/enriched.html';return `<article class="asset"><div class="row"><strong>${esc(m.source_name)} · ${esc(m.table_name)}${m.column_name?'.'+esc(m.column_name):''}</strong><a href="${href}">Open catalog</a></div><p>${esc(m.reason)}</p></article>`}).join(''):'<p class="empty">No matching assets to display.</p>'}</section>`}catch(err){status.className='error';status.textContent=`Search failed: ${err.message}`}finally{button.disabled=false}}
document.querySelector('#question').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();askCatalog()}});
</script></body></html>
