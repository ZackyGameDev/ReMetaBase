<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReMetaBase · Schema Explorer</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif;color:#172033;background:#f4f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 20px 56px}header{display:flex;align-items:center;gap:14px;margin-bottom:24px}.mark{font-size:28px;color:#155eef}h1{font-size:22px;margin:0}header p,.muted{color:#647084;margin:4px 0}.panel,.card{background:white;border:1px solid #dce2eb;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #18294a0a}h2{font-size:18px;margin:0 0 6px}.targets{display:grid;gap:12px;margin-top:16px}.card{margin:0;padding:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row input[type=text],.row input[type=password],.row input[type=number],select{border:1px solid #ccd4e0;border-radius:7px;padding:9px;min-width:110px;background:white}.row input.wide{flex:1;min-width:160px}.spacer{flex:1}button{cursor:pointer;border:1px solid #cbd4e2;border-radius:7px;background:#fff;padding:9px 13px;color:#243047}button.primary{background:#155eef;color:white;border-color:#155eef;font-weight:600}button:hover{filter:brightness(.97)}label{font-size:12px;color:#596579}.field{display:grid;gap:5px;flex:1;min-width:130px;margin-top:12px}.actions{margin-top:14px}.status{font-size:13px;color:#536176}.results{display:grid;gap:18px}.dbhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.tablebox{border:1px solid #e0e5ed;border-radius:9px;margin-top:12px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #e8ebf1;white-space:nowrap}th{background:#f3f5f8;color:#4d596d}tbody tr:last-child td{border-bottom:0}.tbltitle{font-size:16px;margin:22px 0 0}.error{color:#b42318;background:#fff2f0;padding:12px;border-radius:8px;white-space:pre-wrap}.tag{font-size:12px;background:#eef3ff;color:#1749ad;padding:5px 8px;border-radius:20px}.empty{padding:18px;color:#657184;text-align:center}@media(max-width:650px){.wrap{padding:18px 12px}.field{min-width:100%}}
  </style>
</head>
<body><main class="wrap">
  <header><span class="mark">▤</span><div><h1>ReMetaBase</h1><p>Database schema explorer · read-only inspection</p></div></header>
  <section class="panel"><h2>Databases</h2><p class="muted">Configure connection details, select sources, then sync metadata and a small read-only row sample.</p>
    <div id="targets" class="targets"></div>
    <div class="row actions"><button onclick="addTarget()">＋ Add database</button><span class="spacer"></span><label>Sample rows/table <input id="sample-limit" type="number" min="1" max="50" value="5" style="width:70px"></label><button id="sync" class="primary" onclick="syncSelected()">Sync selected databases</button></div>
    <p id="status" class="status"></p>
  </section>
  <section><div id="results" class="results"><div class="panel empty">Sync selected databases to view their tables, columns, constraints, and sample rows.</div></div></section>
</main>
<script>
const targets=[
 {id:'db-pg',label:'ERP Production',dialect:'postgresql',host:'localhost',port:5433,database:'erp_production',username:'demo_user',password:'demo_password',selected:true},
 {id:'db-mysql',label:'HR System',dialect:'mysql',host:'localhost',port:3307,database:'hr_system',username:'demo_user',password:'demo_password',selected:true},
 {id:'db-sqlite',label:'Legacy Edge Logs',dialect:'sqlite',host:'',port:null,database:'../legacy_ops.db',username:'',password:'',selected:false}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderTargets(){document.querySelector('#targets').innerHTML=targets.map((t,i)=>`<article class="card"><div class="row"><input type="checkbox" ${t.selected?'checked':''} aria-label="Select ${esc(t.label)}" onchange="set(${i},'selected',this.checked)"><input class="wide" value="${esc(t.label)}" aria-label="Database label" onchange="set(${i},'label',this.value)"><span id="ping-${i}" class="status"></span><button onclick="testConnection(${i})">Test connection</button><button onclick="removeTarget(${i})">Remove</button></div><div class="row">${field(i,'dialect','Dialect',`<select onchange="set(${i},'dialect',this.value)"><option value="postgresql" ${t.dialect==='postgresql'?'selected':''}>PostgreSQL</option><option value="mysql" ${t.dialect==='mysql'?'selected':''}>MySQL</option><option value="sqlite" ${t.dialect==='sqlite'?'selected':''}>SQLite</option></select>`)}${field(i,'host','Host',`<input ${t.dialect==='sqlite'?'disabled':''} value="${esc(t.host)}" onchange="set(${i},'host',this.value)">`)}${field(i,'port','Port',`<input type="number" ${t.dialect==='sqlite'?'disabled':''} value="${t.port??''}" onchange="set(${i},'port',Number(this.value)||null)">`)}${field(i,'database',t.dialect==='sqlite'?'File path':'Database',`<input class="wide" value="${esc(t.database)}" onchange="set(${i},'database',this.value)">`)}${field(i,'username','Username',`<input ${t.dialect==='sqlite'?'disabled':''} value="${esc(t.username)}" onchange="set(${i},'username',this.value)">`)}${field(i,'password','Password',`<input type="password" ${t.dialect==='sqlite'?'disabled':''} value="${esc(t.password)}" onchange="set(${i},'password',this.value)">`)}</div></article>`).join('')}
function field(i,k,label,control){return `<label class="field">${label}${control}</label>`}
function set(i,k,v){targets[i][k]=v;if(k==='dialect'||k==='selected')renderTargets()}
function addTarget(){targets.push({id:`db-${crypto.randomUUID()}`,label:`Database ${targets.length+1}`,dialect:'postgresql',host:'localhost',port:5432,database:'',username:'',password:'',selected:true});renderTargets()}
function removeTarget(i){targets.splice(i,1);renderTargets()}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(`Request failed (${r.status}): ${await r.text()}`);return r.json()}
async function testConnection(i){const el=document.querySelector(`#ping-${i}`);el.textContent='Testing…';try{const r=await post('/api/test-connection',targets[i]);el.textContent=r.ok?r.message:`Failed: ${r.message}`}catch(e){el.textContent=e.message}}
async function syncSelected(){const btn=document.querySelector('#sync'),status=document.querySelector('#status'),out=document.querySelector('#results');btn.disabled=true;status.textContent='Syncing metadata into the central catalog…';try{const result=await post('/api/sync',{targets,sample_limit:Number(document.querySelector('#sample-limit').value)||5});const errors=result.synced.filter(x=>x.status==='error');status.textContent=errors.length?`Sync issues: ${errors.map(x=>`${x.label}: ${x.error}`).join('; ')}`:`Saved ${result.synced.length} source(s) to the catalog.`;await loadCatalog()}catch(e){status.textContent='Sync failed';out.innerHTML=`<div class="panel error">${esc(e.message)}</div>`}finally{btn.disabled=false}}
async function loadCatalog(){const out=document.querySelector('#results');try{const sources=await fetch('/api/catalog').then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()});out.innerHTML=sources.length?sources.map(renderSource).join(''):'<div class="panel empty">Catalog is empty. Select databases above and click Sync.</div>'}catch(e){out.innerHTML=`<div class="panel error">Could not load catalog: ${esc(e.message)}<br>Start the catalog database and ensure it has been initialized.</div>`}}
function renderSource(src){return `<section class="panel"><div class="dbhead"><div><h2>${esc(src.name)}</h2><p class="muted">Stored in metabase_catalog · Last synced: ${esc(src.last_extracted_at)}</p></div><span class="tag">${esc(src.db_type)} · ${src.tables.length} tables</span></div>${src.tables.map(renderTable).join('')||'<p class="muted">No active tables.</p>'}<h3 class="tbltitle">Schema evolution</h3>${src.change_logs.length?src.change_logs.map(l=>`<p class="muted">v${esc(l.version_no)} · ${esc(l.change_type)} ${esc(l.object_type)} ${esc(l.object_name)} ${esc(l.old_value||'∅')} → ${esc(l.new_value||'∅')}</p>`).join(''):'<p class="muted">No schema changes recorded.</p>'}</section>`}
function renderTable(t){const cols=t.columns.map(c=>{const p=c.dialect_props||{};return `<tr><td>${esc(c.column_name)}</td><td>${esc(c.raw_type)}</td><td>${esc(c.unified_type||'—')}</td><td>${esc(c.is_nullable?'Yes':'No')}</td><td>${esc([c.is_primary_key?'PRIMARY KEY':'',c.foreign_key?`FK → ${c.foreign_key}`:'',p.unique?'UNIQUE':'',...(p.check_constraints||[]).map(x=>`CHECK ${x}`),p.default?`DEFAULT ${p.default}`:''].filter(Boolean).join(' · ')||'—')}</td><td>${((Number(p.null_fraction)||0)*100).toFixed(1)}%</td></tr>`}).join('');return `<h3 class="tbltitle">${esc(t.table_name)} <span class="muted">· ${t.row_count} rows · ${(Number(t.null_fraction)*100).toFixed(1)}% average null rate</span></h3><div class="tablebox"><table><thead><tr><th>Column</th><th>Raw type</th><th>Unified type</th><th>Nullable</th><th>Keys / properties</th><th>Null rate</th></tr></thead><tbody>${cols}</tbody></table></div>`}
renderTargets();loadCatalog();
</script></body></html>
